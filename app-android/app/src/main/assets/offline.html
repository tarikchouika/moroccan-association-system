<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لا يوجد اتصال — منصة مامب</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Arabic", sans-serif;
    background: #f6fafe;
    color: #0d1b33;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 420px;
    width: 100%;
    text-align: center;
    background: #fff;
    border: 1px solid #dce6f4;
    border-radius: 24px;
    padding: 48px 28px;
    box-shadow: 0 10px 40px rgba(11, 20, 16, 0.08);
  }
  .icon {
    width: 84px; height: 84px;
    margin: 0 auto 24px;
    border-radius: 24px;
    background: #0a1733;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon svg { width: 44px; height: 44px; }
  h1 { font-size: 22px; font-weight: 900; margin-bottom: 12px; color: #0a1128; }
  p { font-size: 15px; line-height: 1.9; color: #4e617e; margin-bottom: 28px; }
  a.retry {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #0a1733;
    color: #fff;
    text-decoration: none;
    font-weight: 800;
    font-size: 15px;
    padding: 14px 36px;
    border-radius: 14px;
  }
  .hint { margin-top: 20px; font-size: 12px; color: #8fa3c4; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#eda81d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a10 10 0 1 0 10 10"/>
        <path d="M12 12 22 2"/>
      </svg>
    </div>
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>يتطلب تطبيق منصة مامب اتصالاً بالشبكة لعرض خدمات الجمعيات والمساعد الجمعوي.<br>تحققوا من اتصالكم (Wi-Fi أو بيانات الهاتف) ثم أعيدوا المحاولة.</p>
    <a class="retry" href="https://mamp.pages.dev/">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
      إعادة المحاولة
    </a>
    <p class="hint">منصة مامب — إدارة الجمعيات المغربية</p>
  </div>
</body>
</html>
