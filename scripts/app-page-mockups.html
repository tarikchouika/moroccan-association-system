<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html.ltr body, html.ltr .card-outer, html.ltr .phone, html.ltr .pp { direction: ltr; }
  body { font-family: "Cairo", "Inter", sans-serif; background: #ffffff; }
  html.latn body { font-family: "Inter", "Cairo", sans-serif; }
  .latn-ltr { direction: ltr; }

  /* ================= 1) صورة البطل — 960×640 ================= */
  #hero-shot {
    width: 960px; height: 640px; direction: ltr;
    background:
      radial-gradient(700px 400px at 88% -10%, rgba(237,168,29,.16), transparent 60%),
      radial-gradient(800px 500px at 8% 110%, rgba(0,103,200,.20), transparent 60%),
      linear-gradient(160deg, #f6fafe 0%, #e8f2fd 100%);
    display: flex; align-items: center; justify-content: center; gap: 64px;
    position: relative; overflow: hidden;
  }
  #hero-shot::before {
    content: ""; position: absolute; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg width='64' height='64' viewBox='0 0 64 64' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M32 4l7 7-7 7-7-7 7-7zM32 46l7 7-7 7-7-7 7-7zM4 32l7-7 7 7-7 7-7-7zM46 32l7-7 7 7-7 7-7-7z' fill='%230067c8' fill-opacity='0.05'/%3E%3C/svg%3E");
  }
  .hero-text { position: relative; z-index: 2; max-width: 400px; direction: var(--hero-dir, rtl); text-align: start; }
  .hero-text .badge {
    display: inline-flex; align-items: center; gap: 9px;
    background: #ffffff; border: 1px solid #dce6f4; border-radius: 999px;
    padding: 8px 16px; font-size: 14px; font-weight: 700; color: #0067c8;
    box-shadow: 0 4px 14px rgba(0,103,200,.10);
  }
  .hero-text .badge .dot { width: 9px; height: 9px; border-radius: 50%; background: #00b368; }
  .hero-text h1 { font-size: 38px; font-weight: 900; color: #0d1b33; line-height: 1.4; margin: 18px 0 10px; }
  .hero-text h1 span { color: #0067c8; }
  .hero-text p { font-size: 16px; color: #4e617e; line-height: 1.9; }
  .hero-bubbles { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
  .bubble {
    display: inline-flex; align-items: center; gap: 7px;
    background: #ffffff; border: 1px solid #dce6f4; border-radius: 12px;
    padding: 9px 13px; font-size: 12.5px; font-weight: 700; color: #0d1b33;
    box-shadow: 0 3px 10px rgba(13,27,51,.06);
  }
  .bubble .ico { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font-size: 13px; }

  /* إطار الهاتف */
  .phone {
    position: relative; z-index: 2; width: 330px; height: 600px;
    background: #071431; border-radius: 46px; padding: 10px; direction: ltr;
    box-shadow: 0 30px 70px rgba(7,20,49,.35), 0 8px 24px rgba(7,20,49,.25);
  }
  .phone .screen {
    width: 100%; height: 100%; border-radius: 37px; overflow: hidden;
    background: #f6fafe; display: flex; flex-direction: column; position: relative;
  }
  .statusbar {
    height: 36px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; font-size: 12px; font-weight: 700; color: #fff;
    background: linear-gradient(160deg, #0a1733 0%, #0c1f44 100%);
  }
  .statusbar .icons { display: flex; gap: 5px; align-items: center; }
  .appbar {
    background: linear-gradient(160deg, #0a1733 0%, #0c1f44 100%);
    padding: 10px 18px 16px; color: #fff;
  }
  .appbar .row1 { display: flex; align-items: center; gap: 10px; }
  .appbar .logo-mark {
    width: 34px; height: 34px; border-radius: 10px;
    background: conic-gradient(from 210deg, #0067c8, #00b368, #eda41d, #0067c8);
    display: grid; place-items: center; font-weight: 900; font-size: 12px; color: #071431;
  }
  .appbar .t1 { font-size: 16px; font-weight: 800; }
  .appbar .t2 { font-size: 10.5px; opacity: .75; font-weight: 600; margin-top: 1px; }
  .appbar .avatar { margin-inline-start: auto; width: 32px; height: 32px; border-radius: 50%;
    background: #eda41d; color: #071431; display: grid; place-items: center; font-weight: 800; font-size: 12px; }
  .appbar .search {
    margin-top: 12px; background: rgba(255,255,255,.10); border-radius: 10px;
    padding: 8px 12px; font-size: 11.5px; color: rgba(255,255,255,.75); font-weight: 600;
  }
  .app-body { flex: 1; padding: 14px 14px 10px; overflow: hidden; }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  .stat {
    background: #fff; border: 1px solid #e3ecf7; border-radius: 14px; padding: 10px 12px;
    box-shadow: 0 2px 8px rgba(13,27,51,.04);
  }
  .stat .n { font-size: 17px; font-weight: 900; color: #0d1b33; }
  .stat .l { font-size: 10px; color: #7c8ba1; font-weight: 700; margin-top: 2px; }
  .stat.blue .n { color: #0067c8; } .stat.gold .n { color: #c98d10; }
  .sec-title { display: flex; align-items: center; justify-content: space-between; margin: 13px 2px 8px; }
  .sec-title .a { font-size: 12.5px; font-weight: 800; color: #0d1b33; }
  .sec-title .b { font-size: 10px; font-weight: 700; color: #0067c8; }
  .assoc-list { display: flex; flex-direction: column; gap: 8px; }
  .assoc {
    display: flex; align-items: center; gap: 10px; background: #fff;
    border: 1px solid #e3ecf7; border-radius: 13px; padding: 9px 11px;
  }
  .assoc .lg { width: 34px; height: 34px; border-radius: 10px; flex: none;
    display: grid; place-items: center; font-weight: 800; font-size: 13px; }
  .assoc .nm { font-size: 11.5px; font-weight: 800; color: #0d1b33; }
  .assoc .ct { font-size: 9.5px; color: #7c8ba1; font-weight: 600; margin-top: 1px; }
  .assoc .st { margin-inline-start: auto; font-size: 9px; font-weight: 800; color: #008a52;
    background: #e3f7ed; border-radius: 999px; padding: 3px 8px; flex: none; }
  .bottombar {
    height: 52px; background: #ffffff; border-top: 1px solid #e3ecf7;
    display: flex; align-items: center; justify-content: space-around; padding: 0 8px;
  }
  .bottombar .it { display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-size: 8.5px; font-weight: 700; color: #7c8ba1; }
  .bottombar .it.on { color: #0067c8; }
  .bottombar .ic { width: 20px; height: 20px; border-radius: 6px; background: currentColor; opacity: .85; }
  .it.on .ic { opacity: 1; }

  /* ================= 2) لقطات أندرويد — Play Protect ================= */
  .pp {
    width: 560px; background: #f2f5f9; direction: ltr; position: relative; overflow: hidden;
  }
  .pp .ph {
    margin: 0 auto; width: 460px; min-height: 720px; background: #0d1b33;
    border-radius: 34px; padding: 9px; box-shadow: 0 24px 60px rgba(7,20,49,.35);
    position: relative;
  }
  .pp .scr { width: 100%; height: 100%; border-radius: 27px; overflow: hidden; background: #f8fafd; display: flex; flex-direction: column; }
  .pp .sb {
    height: 34px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 18px; font-size: 11.5px; font-weight: 700; color: #fff; background: #0d1b33; flex: none;
  }
  .pp .sb .r { display: flex; gap: 5px; align-items: center; }
  .pp .content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; background: #f8fafd; }
  .dlg { width: 100%; max-width: 350px; background: #ffffff; border-radius: 28px; padding: 26px 24px 18px;
    box-shadow: 0 12px 40px rgba(13,27,51,.16); text-align: center; }
  .dlg .shield {
    width: 74px; height: 74px; margin: 0 auto 16px; border-radius: 50%;
    display: grid; place-items: center;
  }
  .dlg h2 { font-size: 17.5px; font-weight: 800; color: #0d1b33; line-height: 1.5; }
  .dlg .bdy { font-size: 13px; color: #5a6b81; line-height: 1.85; margin-top: 10px; font-weight: 500; }
  .dlg .brand-row { display: flex; align-items: center; gap: 10px; margin-top: 16px; background: #f2f6fb; border-radius: 14px; padding: 10px 12px; text-align: start; }
  .dlg .brand-row .icn { width: 38px; height: 38px; border-radius: 11px; flex: none; display: grid; place-items: center; }
  .dlg .brand-row .nm { font-size: 12.5px; font-weight: 800; color: #0d1b33; }
  .dlg .brand-row .src { font-size: 10px; color: #7c8ba1; font-weight: 600; margin-top: 1px; }
  .dlg .note { margin-top: 12px; font-size: 11px; color: #8a97a9; line-height: 1.7; font-weight: 600; }
  .dlg .actions { display: flex; flex-direction: column; gap: 4px; margin-top: 18px; }
  .dlg .act { font-size: 13.5px; font-weight: 800; color: #0067c8; padding: 12px; border-radius: 999px; }
  .dlg .act.ghost { color: #5a6b81; font-weight: 700; }
  .dlg .act.pill { background: #0067c8; color: #fff; }

  /* شاشة الإعدادات (pp2) */
  .set-screen { flex: 1; display: flex; flex-direction: column; background: #f8fafd; overflow: hidden; }
  .set-top { background: #ffffff; padding: 18px 20px 14px; border-bottom: 1px solid #e7edf4; }
  .set-top .back { font-size: 12px; color: #0067c8; font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .set-top h3 { font-size: 19px; font-weight: 800; color: #0d1b33; margin-top: 10px; }
  .set-app { display: flex; align-items: center; gap: 12px; padding: 16px 20px; background: #fff; margin-top: 2px; }
  .set-app .icn { width: 46px; height: 46px; border-radius: 12px; }
  .set-app .nm { font-size: 14px; font-weight: 800; color: #0d1b33; }
  .set-app .src { font-size: 11px; color: #7c8ba1; font-weight: 600; margin-top: 2px; }
  .toggle-card { margin: 14px 16px; background: #ffffff; border-radius: 20px; padding: 18px;
    box-shadow: 0 3px 14px rgba(13,27,51,.05); }
  .toggle-card .row { display: flex; align-items: center; gap: 14px; }
  .toggle-card .info { flex: 1; }
  .toggle-card .ti { font-size: 14.5px; font-weight: 800; color: #0d1b33; }
  .toggle-card .td { font-size: 11.5px; color: #5a6b81; line-height: 1.75; margin-top: 5px; font-weight: 500; }
  .switch { width: 52px; height: 32px; border-radius: 999px; background: #0067c8; position: relative; flex: none; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 23px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
  .toggle-card .hint { margin-top: 14px; font-size: 11px; color: #8a97a9; line-height: 1.7; font-weight: 600; }
  .navbar3 { height: 50px; background: #ffffff; border-top: 1px solid #e7edf4; display: flex; align-items: center; justify-content: space-around; flex: none; }
  .navbar3 .i { width: 18px; height: 18px; border-radius: 5px; background: #b6c2d2; }
  .navbar3 .i.on { background: #0067c8; }

  /* شاشة الاكتمال (pp3) */
  .done-hero { padding: 40px 24px 8px; text-align: center; }
  .done-hero .ring {
    width: 96px; height: 96px; margin: 0 auto; border-radius: 50%;
    background: conic-gradient(from 210deg, #0067c8, #00b368, #eda41d, #0067c8);
    display: grid; place-items: center;
  }
  .done-hero .ring::after { content: ""; width: 78px; height: 78px; border-radius: 50%; background: #f8fafd; }
  .done-hero .chk {
    position: absolute; margin-top: -66px; margin-left: 33px; width: 30px; height: 30px;
    border-radius: 50%; background: #00b368; color: #fff; display: grid; place-items: center;
    font-size: 15px; font-weight: 900; z-index: 3;
  }
  .app-icon-big {
    width: 92px; height: 92px; margin: 22px auto 0; border-radius: 24px;
    background: conic-gradient(from 210deg, #0067c8, #00b368, #eda41d, #0067c8);
    display: grid; place-items: center; color: #071431; font-weight: 900; font-size: 26px;
    box-shadow: 0 10px 26px rgba(0,103,200,.30);
  }
  .done-hero h2 { font-size: 20px; font-weight: 900; color: #0d1b33; margin-top: 16px; }
  .done-hero .sub { font-size: 12.5px; color: #5a6b81; font-weight: 600; margin-top: 6px; line-height: 1.8; }
  .done-hero .rowbtns { display: flex; gap: 10px; justify-content: center; margin-top: 22px; }
  .done-hero .btn { padding: 12px 26px; border-radius: 999px; font-size: 13.5px; font-weight: 800; }
  .done-hero .btn.primary { background: #0067c8; color: #fff; box-shadow: 0 8px 20px rgba(0,103,200,.30); }
  .done-hero .btn.ghost { border: 1.5px solid #d7e0ec; color: #5a6b81; }
  .done-list { margin: 24px 26px 0; background: #fff; border-radius: 18px; padding: 6px 18px; box-shadow: 0 3px 14px rgba(13,27,51,.05); }
  .done-list .li { display: flex; align-items: center; gap: 12px; padding: 12px 2px; border-bottom: 1px solid #eef3f8; }
  .done-list .li:last-child { border-bottom: 0; }
  .done-list .ic { width: 34px; height: 34px; border-radius: 10px; flex: none; display: grid; place-items: center; font-size: 15px; }
  .done-list .t { font-size: 12.5px; font-weight: 800; color: #0d1b33; }
  .done-list .s { font-size: 10.5px; color: #7c8ba1; font-weight: 600; margin-top: 1px; }
</style>
</head>
<body>

  <div class="ph"><div class="scr">
    <div class="sb"><span>09:41</span><span class="r"><span>▮▮▮</span><span>ᯤ</span><span>🔋</span></span></div>

<script>
/* ===== النصوص الثماني اللغات — تُحقن عبر معامل ?lang= ===== */
const T = {
